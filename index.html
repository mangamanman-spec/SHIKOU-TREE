<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4efff">
<title>思考ツリー</title>
<!-- html2canvas & jsPDF for Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f7f5fb;--panel:#fff;--ink:#29252f;--muted:#77717f;--accent:#8d6bd1;--line:#b9a9d8;--q:#eee7ff;--a:#fff7dc;--danger:#c94d5b;--orange:#ff8c00}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none}
button,input,textarea{font:inherit}button{cursor:pointer}
header{padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-bottom:1px solid #ddd6e8;position:relative;z-index:5}
.title-area{display:flex;align-items:center;gap:6px;flex:1;min-width:140px;overflow:hidden}
.title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:10px;color:var(--muted);font-weight:400;display:none}
@media(min-width:500px){.subtitle{display:block}}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:35vw;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:11px;padding:3px 6px;background:#eee8f6;border:1px solid #d7cee7;border-radius:6px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.tab.active{background:white;color:var(--accent);font-weight:bold;border-color:var(--accent)}
.header-actions{display:flex;gap:6px;align-items:center}
.btn{border:1px solid #d7cee7;background:white;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.danger{color:var(--danger)}
#viewport{position:absolute;top:52px;bottom:0;left:0;right:0;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;width:5000px;height:5000px;transform-origin:0 0}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edge{stroke:var(--line);stroke-width:3;fill:none}
.edge.link-edge{stroke:var(--orange);stroke-dasharray:6,6;stroke-width:3.5}
.node{position:absolute;width:220px;min-height:92px;background:var(--panel);border:2px solid #d7cee7;border-radius:16px;padding:12px 13px;box-shadow:0 4px 14px rgba(70,50,100,.09);touch-action:none;-webkit-user-select:none;user-select:none}
.node.question{background:var(--q);border-color:#cdbce9}
.node.answer{background:var(--a);border-color:#ead89b}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,107,209,.18)}
.node.linking{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,140,0,.35);animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.node .kind{font-size:10px;color:var(--muted);margin-bottom:5px}
.node .text{font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.node .text strong{font-weight:700;color:var(--accent)}
.node .actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.node .actions button{font-size:10px;padding:4px 6px;border-radius:6px;border:1px solid #ddd;background:#fff}
#hint{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid #ddd6e8;border-radius:12px;padding:9px 11px;font-size:12px;color:var(--muted);z-index:4;box-shadow:0 2px 8px #00000010}
#modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:18px;-webkit-user-select:none;user-select:none}
.dialog{width:min(520px,100%);background:white;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0004;position:relative;transform:translate(0,0)}
.dialog h2{margin:0 0 10px;font-size:18px;cursor:grab;touch-action:none;user-select:none}.dialog h2:active{cursor:grabbing}
.dialog label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.parent-preview{background:#f4efff;border:1px solid #d7cee7;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;color:var(--ink);max-height:70px;overflow-y:auto}
textarea,input[type=text]{width:100%;border:1px solid #d8d1e0;border-radius:10px;padding:10px;background:#faf9fc;outline:none;-webkit-user-select:text;user-select:text}
textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.typeRow{display:flex;gap:8px}.typeRow button{flex:1;padding:9px;border:1px solid #ddd;border-radius:9px;background:white}.typeRow button.active{border-color:var(--accent);background:#eee7ff}
.toolbar{display:flex;gap:6px;margin-top:6px}
.toolbar button{padding:4px 12px;border:1px solid #d7cee7;background:#fff;border-radius:6px;font-weight:bold;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#29252f;color:white;padding:9px 13px;border-radius:10px;font-size:12px;display:none;z-index:30}
</style>
</head>
<body>
<header>
  <div class="title-area">
    <div class="title" id="appTitle">ウリを考える</div>
    <div class="subtitle">思考ツリー</div>
    <div class="tabs" id="tabsContainer"></div>
  </div>
  <div class="header-actions">
    <button class="btn" id="exportBtn">出力 ▼</button>
    <button class="btn" id="reset">最初から</button>
    <button class="btn primary" id="addRoot">＋ 新規</button>
  </div>
</header>
<div id="viewport">
  <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
  <div id="hint">長押し：線つなぎ開始　／　ドラッグ：移動</div>
</div>
<div id="modal">
 <div class="dialog" id="dialogBox">
  <h2 id="modalTitle">ノードを編集</h2>
  <div id="parentPreviewArea" style="display:none;">
    <label>元の問い（親）</label>
    <div class="parent-preview" id="parentPreviewText"></div>
  </div>
  <label>種類</label>
  <div class="typeRow"><button data-type="question">問い</button><button data-type="answer">答え・アイデア</button></div>
  <label>内容</label>
  <textarea id="nodeText" placeholder="ここに問いやアイデアを書く（Enterで保存）"></textarea>
  <div class="toolbar">
    <button type="button" id="boldBtn" title="太字にする">B</button>
  </div>
  <div class="row"><button class="btn" id="cancel">キャンセル</button><button class="btn primary" id="save">保存</button></div>
 </div>
</div>
<div id="toast"></div>
<script>
const STORAGE_KEY="shikou-tree-multi-v8";
let allTrees = loadAll();
let currentTreeId = allTrees.activeId || allTrees.trees[0].id;

function getTree(){ return allTrees.trees.find(t => t.id === currentTreeId) || allTrees.trees[0]; }

function loadAll(){
 try{
   let x = JSON.parse(localStorage.getItem(STORAGE_KEY));
   if(x && x.trees && x.trees.length) return x;
 }catch(e){}
 let defaultTree = {
   id: "t_default",
   nodes:[
    {id:"root",parent:null,type:"question",text:"この企画のウリは何か？",x:1000,y:260,links:[]},
    {id:"a",parent:"root",type:"question",text:"他の企画と何が違う？",x:650,y:530,links:[]},
    {id:"b",parent:"root",type:"question",text:"見る人に何を感じてほしい？",x:1000,y:530,links:[]},
    {id:"c",parent:"root",type:"question",text:"「これがあるから見る」と言えるものは？",x:1350,y:530,links:[]}
   ]
 };
 return { activeId: "t_default", trees: [defaultTree] };
}

function saveAll(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(allTrees)); }

let editing=null, selected=null, zoom=1, pan={x:0,y:0}, type="question", linkingFrom=null;
const world=document.getElementById("world"), nodesEl=document.getElementById("nodes"), edges=document.getElementById("edges"), viewport=document.getElementById("viewport");
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",1500)}
function apply(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;render()}

function fitInitial(){
  const r = viewport.getBoundingClientRect();
  let tree = getTree();
  const root = tree.nodes.find(n => !n.parent) || tree.nodes[0];
  if(root){
    pan.x = (r.width / 2) - (root.x + 110);
    pan.y = 80;
  }
  zoom = 1;
  apply();
}

function updateHeaderTitle(){
  let tree = getTree();
  let root = tree.nodes.find(n => !n.parent);
  let title = root ? root.text : "無題のツリー";
  title = title.split('\n')[0];
  document.getElementById("appTitle").textContent = title;
  renderTabs();
}

function renderTabs(){
  let c = document.getElementById("tabsContainer");
  c.innerHTML = "";
  allTrees.trees.forEach(t => {
    let root = t.nodes.find(n => !n.parent);
    let name = root ? root.text.split('\n')[0] : "新規ツリー";
    let div = document.createElement("div");
    div.className = "tab" + (t.id === currentTreeId ? " active" : "");
    div.textContent = name;
    
    div.onclick = (e) => {
      if (div.dataset.preventClick) return;
      currentTreeId = t.id;
      allTrees.activeId = currentTreeId;
      saveAll();
      selected = null;
      linkingFrom = null;
      updateHeaderTitle();
      fitInitial();
      render();
    };

    let pressTimer = null;
    let startLongPress = (e) => {
      div.dataset.preventClick = "true";
      pressTimer = setTimeout(() => {
        if(allTrees.trees.length <= 1) {
          alert("最後のツリーは削除できません。");
          return;
        }
        if(confirm(`「${name}」のツリーを削除しますか？`)) {
          allTrees.trees = allTrees.trees.filter(item => item.id !== t.id);
          currentTreeId = allTrees.trees[0].id;
          allTrees.activeId = currentTreeId;
          saveAll();
          updateHeaderTitle();
          fitInitial();
          render();
          toast("ツリーを削除しました");
        }
      }, 600);
    };
    let cancelLongPress = () => { 
      if(pressTimer) clearTimeout(pressTimer); 
      setTimeout(() => { delete div.dataset.preventClick; }, 100);
    };

    div.addEventListener("pointerdown", startLongPress);
    div.addEventListener("pointerup", cancelLongPress);
    div.addEventListener("pointercancel", cancelLongPress);
    c.appendChild(div);
  });
}

function parseMarkdown(str) {
  if (!str) return "";
  let escaped = str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
}

function render(){
 updateHeaderTitle();
 let tree = getTree();
 nodesEl.innerHTML="";
 tree.nodes.forEach(n=>{
  let d=document.createElement("div"); 
  d.className="node "+n.type+(selected===n.id?" selected":"")+(linkingFrom===n.id?" linking":""); 
  d.dataset.id=n.id;
  d.style.left=n.x+"px";d.style.top=n.y+"px";
  
  d.innerHTML=`<div class="kind">${n.type==="question"?"問い":"答え・アイデア"}</div><div class="text"></div><div class="actions"><button data-act="add">＋枝</button><button data-act="edit">編集</button><button data-act="del">削除</button></div>`;
  d.querySelector(".text").innerHTML = parseMarkdown(n.text);
  
  d.querySelector('[data-act="add"]').onclick=()=>openEditor(null,n.id);
  d.querySelector('[data-act="edit"]').onclick=()=>openEditor(n.id);
  d.querySelector('[data-act="del"]').onclick=()=>delNode(n.id);
  
  nodesEl.appendChild(d);
 });
 drawEdges();
}

let activeNodeDrag = null;
let nodePressTimer = null;

window.addEventListener("pointerdown", e => {
  let nodeEl = e.target.closest(".node");
  if(nodeEl && !e.target.closest("button")) {
    let id = nodeEl.dataset.id;
    let tree = getTree();
    let n = tree.nodes.find(x => x.id === id);
    if(n) {
      // 【接続モード中の場合】つなぎ先のノードを「通常タップ」したとみなす
      if(linkingFrom) {
        if(nodePressTimer) clearTimeout(nodePressTimer);
        handleNodeTapForLinking(id);
        e.preventDefault();
        return;
      }

      selected = id; render();
      activeNodeDrag = {id, startX: e.clientX, startY: e.clientY, origX: n.x, origY: n.y, moved: false};
      
      // 【長押し判定】最初のノードを長押しすると接続モード開始
      nodePressTimer = setTimeout(() => {
        if(activeNodeDrag && !activeNodeDrag.moved) {
          startLinking(id);
        }
      }, 600);

      e.preventDefault();
    }
  }
});

function startLinking(id) {
  activeNodeDrag = null;
  linkingFrom = id;
  toast("つなぎ先のノードをタップしてください");
  render();
}

function handleNodeTapForLinking(id) {
  let tree = getTree();
  if(linkingFrom === id) {
    linkingFrom = null;
    toast("接続モードを解除しました");
    render();
  } else {
    let sourceNode = tree.nodes.find(x => x.id === linkingFrom);
    if(sourceNode) {
      if(!sourceNode.links) sourceNode.links = [];
      let idx = sourceNode.links.indexOf(id);
      if(idx > -1) {
        sourceNode.links.splice(idx, 1);
        toast("オレンジの線を外しました");
      } else {
        sourceNode.links.push(id);
        toast("オレンジの線で繋ぎました！");
      }
      saveAll();
    }
    linkingFrom = null;
    render();
  }
}

window.addEventListener("pointermove", e => {
  if(!activeNodeDrag) return;
  let dx = (e.clientX - activeNodeDrag.startX) / zoom;
  let dy = (e.clientY - activeNodeDrag.startY) / zoom;
  if(Math.abs(dx) + Math.abs(dy) > 3) {
    activeNodeDrag.moved = true;
    if(nodePressTimer) clearTimeout(nodePressTimer);
  }
  let tree = getTree();
  let n = tree.nodes.find(x => x.id === activeNodeDrag.id);
  if(n && activeNodeDrag.moved) {
    n.x = activeNodeDrag.origX + dx;
    n.y = activeNodeDrag.origY + dy;
    render();
  }
});

window.addEventListener("pointerup", () => {
  if(nodePressTimer) clearTimeout(nodePressTimer);
  if(activeNodeDrag?.moved) { saveAll(); toast("位置を保存しました"); }
  activeNodeDrag = null;
});

function drawEdges(){
 edges.innerHTML="";
 let tree = getTree();
 
 tree.nodes.forEach(n=>{
  if(!n.parent)return;
  let p=tree.nodes.find(x=>x.id===n.parent);if(!p)return;
  let x1=p.x+110,y1=p.y+92,x2=n.x+110,y2=n.y;
  let mid=(y1+y2)/2;
  let path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`);
  path.setAttribute("class","edge");
  edges.appendChild(path);
 });

 tree.nodes.forEach(n=>{
  if(!n.links) return;
  n.links.forEach(targetId => {
    let target = tree.nodes.find(x => x.id === targetId);
    if(!target) return;
    let x1 = n.x + 110, y1 = n.y + 46;
    let x2 = target.x + 110, y2 = target.y + 46;
    let path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", `M ${x1} ${y1} Q ${(x1+x2)/2} ${Math.min(y1,y2)-50} ${x2} ${y2}`);
    path.setAttribute("class", "edge link-edge");
    edges.appendChild(path);
  });
 });
}

const dialogBox = document.getElementById("dialogBox");
const modalTitle = document.getElementById("modalTitle");
let isDraggingDialog = false, dialogStartX = 0, dialogStartY = 0, dialogPosX = 0, dialogPosY = 0;

modalTitle.addEventListener("pointerdown", e => {
  isDraggingDialog = true;
  dialogStartX = e.clientX - dialogPosX;
  dialogStartY = e.clientY - dialogPosY;
  modalTitle.setPointerCapture(e.pointerId);
});
modalTitle.addEventListener("pointermove", e => {
  if (!isDraggingDialog) return;
  dialogPosX = e.clientX - dialogStartX;
  dialogPosY = e.clientY - dialogStartY;
  modalBox.style.transform = `translate(${dialogPosX}px, ${dialogPosY}px)`;
});
const endDialogDrag = () => { isDraggingDialog = false; };
modalTitle.addEventListener("pointerup", endDialogDrag);
modalTitle.addEventListener("pointercancel", endDialogDrag);

let pointers = new Map();
let baseDist = 0, baseZoom = 1, basePan = {x:0, y:0}, pinchMid = {x:0, y:0};
let prevClientX = 0, prevClientY = 0;

viewport.addEventListener("pointerdown", e => {
  if (e.target.closest(".node")) return;
  pointers.set(e.pointerId, {clientX: e.clientX, clientY: e.clientY});
  if(pointers.size === 1) { prevClientX = e.clientX; prevClientY = e.clientY; }
  updatePinchBase();
});

function updatePinchBase() {
  let pts = Array.from(pointers.values());
  if (pts.length === 2) {
    baseDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
    baseZoom = zoom;
    basePan = {x: pan.x, y: pan.y};
    const rect = viewport.getBoundingClientRect();
    pinchMid = { x: ((pts[0].clientX + pts[1].clientX) / 2) - rect.left, y: ((pts[0].clientY + pts[1].clientY) / 2) - rect.top };
  } else if (pts.length === 1) {
    prevClientX = pts[0].clientX; prevClientY = pts[0].clientY;
  }
}

viewport.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {clientX: e.clientX, clientY: e.clientY});
  let pts = Array.from(pointers.values());
  
  if (pts.length === 2) {
    let dist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
    if (baseDist > 0) {
      let newZoom = Math.max(0.3, Math.min(2.5, baseZoom * (dist / baseDist)));
      const rect = viewport.getBoundingClientRect();
      let currentMid = { x: ((pts[0].clientX + pts[1].clientX) / 2) - rect.left, y: ((pts[0].clientY + pts[1].clientY) / 2) - rect.top };
      let wx = (pinchMid.x - basePan.x) / baseZoom;
      let wy = (pinchMid.y - basePan.y) / baseZoom;
      zoom = newZoom;
      pan.x = currentMid.x - wx * zoom;
      pan.y = currentMid.y - wy * zoom;
      apply();
    }
  } else if (pts.length === 1) {
    let dx = e.clientX - prevClientX;
    let dy = e.clientY - prevClientY;
    prevClientX = e.clientX; prevClientY = e.clientY;
    pan.x += dx; pan.y += dy;
    apply();
  }
});

function removePointer(e) {
  pointers.delete(e.pointerId);
  updatePinchBase();
  let pts = Array.from(pointers.values());
  if (pts.length === 1) { prevClientX = pts[0].clientX; prevClientY = pts[0].clientY; }
}
viewport.addEventListener("pointerup", removePointer);
viewport.addEventListener("pointercancel", removePointer);

viewport.addEventListener("wheel", e => {
  e.preventDefault();
  let rect = viewport.getBoundingClientRect();
  let cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  let z = e.deltaY < 0 ? 1.08 : .92;
  let newZoom = Math.max(.3, Math.min(2.5, zoom * z));
  let wx = (cx - pan.x) / zoom, wy = (cy - pan.y) / zoom;
  zoom = newZoom; pan.x = cx - wx * zoom; pan.y = cy - wy * zoom;
  apply();
},{passive:false});

function openEditor(id,parent){
 editing=id||null;
 document.getElementById("modal").style.display="flex";
 dialogPosX = 0; dialogPosY = 0;
 dialogBox.style.transform = `translate(0px, 0px)`;

 let tree = getTree();
 let n = id ? tree.nodes.find(x=>x.id===id) : null;
 let parentNode = parent ? tree.nodes.find(x=>x.id===parent) : (n && n.parent ? tree.nodes.find(x=>x.id===n.parent) : null);
 
 let previewArea = document.getElementById("parentPreviewArea");
 let previewText = document.getElementById("parentPreviewText");
 if (parentNode) {
   previewArea.style.display = "block";
   previewText.textContent = parentNode.text;
 } else {
   previewArea.style.display = "none";
 }

 document.getElementById("modalTitle").textContent = id ? "ノードを編集" : (parent ? "子ノードを追加" : "新規ツリー作成");
 let textarea = document.getElementById("nodeText");
 textarea.value = n?.text || "";
 type = n?.type || "question"; 
 setTypeButtons(); 
 textarea.focus();
}

function setTypeButtons(){ 
  document.querySelectorAll(".typeRow button").forEach(b=>b.classList.toggle("active",b.dataset.type===type)); 
}

document.querySelectorAll(".typeRow button").forEach(b=>b.onclick=()=>{ 
  type=b.dataset.type; 
  setTypeButtons(); 
  document.getElementById("nodeText").focus(); 
});

function saveNodeFromModal() {
  let textarea = document.getElementById("nodeText");
  let text = textarea.value.trim(); 
  if(!text) return;
  let tree = getTree();

  let parentId = window._activeParentId;

  if(editing){
    let x = tree.nodes.find(n=>n.id===editing); 
    x.text = text; 
    x.type = type;
  } else if(parentId === null || parentId === undefined) {
    let newId = "t_" + uid();
    let newTree = {
      id: newId,
      nodes: [{id: uid(), parent: null, type: "question", text: text, x: 1000, y: 260, links:[]}]
    };
    allTrees.trees.push(newTree);
    currentTreeId = newId;
    allTrees.activeId = currentTreeId;
    fitInitial();
  } else {
    let p = tree.nodes.find(n=>n.id===parentId);
    let kids = tree.nodes.filter(n=>n.parent===parentId);
    let spacing = 260;
    let startX = p.x - ((kids.length - 1) * spacing) / 2;
    let newX = startX + (kids.length * spacing);
    
    let newId = uid();
    tree.nodes.push({
      id: newId, 
      parent: parentId, 
      type, 
      text, 
      x: newX, 
      y: p.y + 190, 
      links: []
    });
  }
  saveAll(); closeEditor(); render(); toast("保存しました");
}

document.getElementById("nodeText").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    saveNodeFromModal();
  }
});

document.getElementById("boldBtn").onclick = () => {
  let textarea = document.getElementById("nodeText");
  let start = textarea.selectionStart, end = textarea.selectionEnd, val = textarea.value;
  if (start !== end) {
    let selectedText = val.substring(start, end);
    textarea.value = val.substring(0, start) + "**" + selectedText + "**" + val.substring(end);
    textarea.setSelectionRange(start + 2, end + 2);
  } else {
    if (val.trim() === "") {
      textarea.value = "**"; textarea.setSelectionRange(2, 2);
    } else {
      if (val.startsWith("**") && val.endsWith("**")) {
        textarea.value = val.substring(2, val.length - 2);
      } else {
        textarea.value = "**" + val + "**";
      }
    }
  }
  textarea.focus();
};

document.getElementById("save").onclick = saveNodeFromModal;
function closeEditor(){ document.getElementById("modal").style.display="none"; }
document.getElementById("cancel").onclick = closeEditor;

const nativeOpenEditor = openEditor;
window.openEditor = function(id, parent) {
  window._activeParentId = parent;
  nativeOpenEditor(id, parent);
}

function delNode(id){
 let tree = getTree();
 if(tree.nodes.length === 1 || !tree.nodes.find(n=>n.id===id).parent && tree.nodes.filter(n=>!n.parent).length <= 1){
   if(!confirm("大元のノードを削除するとツリー自体が削除されます。よろしいですか？")) return;
   allTrees.trees = allTrees.trees.filter(t => t.id !== currentTreeId);
   if(allTrees.trees.length === 0){
     allTrees.trees.push({id: "t_default", nodes: [{id:"root", parent:null, type:"question", text:"新しい問い", x:1000, y:260, links:[]}]});
   }
   currentTreeId = allTrees.trees[0].id;
   allTrees.activeId = currentTreeId;
   saveAll(); fitInitial(); render(); toast("ツリーを削除しました");
   return;
 }

 if(!confirm("このノードと、その下の枝を削除しますか？")) return;
 let ids = new Set([id]), changed = true;
 while(changed){ changed = false; tree.nodes.forEach(n=>{ if(ids.has(n.parent) && !ids.has(n.id)){ ids.add(n.id); changed = true; } }); }
 tree.nodes = tree.nodes.filter(n=>!ids.has(n.id)); 
 
 tree.nodes.forEach(n => {
   if(n.links) n.links = n.links.filter(lid => !ids.has(lid));
 });

 selected = null; saveAll(); render();
}

document.getElementById("exportBtn").onclick = () => {

  if(oldExportModal) oldExportModal.remove();

  let exportModal = document.createElement("div");
  exportModal.id = "exportModal";
  exportModal.style.cssText = "position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;";
  
  exportModal.innerHTML = `
    <div style="width:min(340px,100%);background:white;border-radius:18px;padding:20px;box-shadow:0 20px 60px #0004;text-align:center;">
      <h3 style="margin:0 0 12px;font-size:16px;">保存形式を選んでください</h3>
      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;">
        <button id="exportPng" class="btn primary" style="flex:1;padding:10px;">PNG画像</button>
        <button id="exportPdf" class="btn primary" style="flex:1;padding:10px;">PDF書類</button>
      </div>
      <button id="exportCancel" class="btn" style="width:100%;">キャンセル</button>

  `;

  document.getElementById("exportPng").onclick = () => {

  document.getElementById("exportPdf").onclick = () => {

};

function executeExport(choice) {
  toast("全体を出力中...");
  let tree = getTree();
  if(tree.nodes.length === 0) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  tree.nodes.forEach(n => {
    if(n.x < minX) minX = n.x;
    if(n.y < minY) minY = n.y;
    if(n.x + 220 > maxX) maxX = n.x + 220;
    if(n.y + 160 > maxY) maxY = n.y + 160;
  });

  let padding = 150;
  minX -= padding; minY -= padding;
  maxX += padding; maxY += padding;
  let exportWidth = maxX - minX;
  let exportHeight = maxY - minY;

  let wrapper = document.createElement("div");
  wrapper.style.cssText = `position:fixed; left:-9999px; top:-9999px; width:${exportWidth}px; height:${exportHeight}px; background:#f7f5fb; pointer-events:none; z-index:-999;`;
  
  let cloneSvg = edges.cloneNode(true);
  cloneSvg.style.cssText = `position:absolute; left:0; top:0; width:${exportWidth}px; height:${exportHeight}px; overflow:visible;`;
  
  let paths = cloneSvg.querySelectorAll("path");
  let pathIndex = 0;
  tree.nodes.forEach(n => {
    if(n.parent) {
      let p = tree.nodes.find(x => x.id === n.parent);
      if(p && paths[pathIndex]) {
        let x1 = (p.x + 110) - minX;
        let y1 = (p.y + 92) - minY;
        let x2 = (n.x + 110) - minX;
        let y2 = n.y - minY;
        let mid = (y1 + y2) / 2;
        paths[pathIndex].setAttribute("d", `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`);
      }
      pathIndex++;
    }
  });

  tree.nodes.forEach(n => {
    if(n.links) {
      n.links.forEach(targetId => {
        let target = tree.nodes.find(x => x.id === targetId);
        if(target && paths[pathIndex]) {
          let x1 = (n.x + 110) - minX;
          let y1 = (n.y + 46) - minY;
          let x2 = (target.x + 110) - minX;
          let y2 = (target.y + 46) - minY;
          paths[pathIndex].setAttribute("d", `M ${x1} ${y1} Q ${(x1+x2)/2} ${Math.min(y1,y2)-50} ${x2} ${y2}`);
        }
        pathIndex++;
      });
    }
  });

  wrapper.appendChild(cloneSvg);

  tree.nodes.forEach(n => {
    let originalNodeEl = nodesEl.querySelector(`[data-id="${n.id}"]`);
    if(originalNodeEl) {
      let cloneNode = originalNodeEl.cloneNode(true);
      let actions = cloneNode.querySelector(".actions");
      if(actions) actions.remove();
      
      cloneNode.style.position = "absolute";
      cloneNode.style.left = (n.x - minX) + "px";
      cloneNode.style.top = (n.y - minY) + "px";
      cloneNode.classList.remove("selected");
      wrapper.appendChild(cloneNode);
    }
  });

  document.body.appendChild(wrapper);

  html2canvas(wrapper, {
    backgroundColor: "#f7f5fb",
    scale: 2,
    width: exportWidth,
    height: exportHeight,
    useCORS: true
  }).then(canvas => {
    wrapper.remove();
    
    let titleName = tree.nodes.find(n=>!n.parent)?.text.split('\n')[0] || "思考ツリー";
    
    if(choice === "1") {
      let link = document.createElement("a");
      link.download = titleName + "_思考ツリー.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      toast("PNG画像を保存しました！");
    } else {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL("image/png");
      const pdf = new jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: "a4"
      });
      
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      
      pdf.addImage(imgData, "PNG", 0, 10, pdfWidth, pdfHeight);
      pdf.save(titleName + "_思考ツリー.pdf");
      toast("PDFファイルを保存しました！");
    }
  }).catch(err => {
    wrapper.remove();
    alert("出力に失敗しました");
  });
}

document.getElementById("reset").onclick = () => { if(confirm("現在のツリーを最初のサンプル状態に戻しますか？")){ localStorage.removeItem(STORAGE_KEY); allTrees=loadAll(); currentTreeId=allTrees.trees[0].id; fitInitial(); saveAll(); render(); toast("初期状態に戻しました"); } };

fitInitial();
render();
